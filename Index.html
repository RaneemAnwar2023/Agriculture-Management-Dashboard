<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Management Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <div class="user-profile p-3 text-center border-bottom">
        <img src="pop.webp" class="rounded-circle mb-2" alt="User Avatar">
        <h6 class="mb-1">Raneem Anwar</h6>
        <small class="text-light">Farm Manager</small>
    </div>

    <a href="#" onclick="showSection('dashboardSection')">📊 Dashboard</a>
    <a href="#" onclick="showSection('cropsSection')">🌾 Crops</a>
    <a href="#">👨‍🌾 Farmers</a>
    <a href="#">📈 Reports</a>
    <a href="#">⚙ Settings</a>
</div>

<!-- Main Content -->
<div id="content" class="content">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <button class="btn btn-success" onclick="toggleSidebar()">☰</button>
            <h4 class="mb-0">Agriculture Dashboard</h4>
            <div>🔔 Notifications | 🚪 Logout</div>
        </div>
    </nav>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection">
        <div class="row g-4 mb-4">
            <div class="col-md-3"><div class="card card-stat p-3 shadow-sm"><h6>Total Crops</h6><h3 id="cropCount">0</h3></div></div>
            <div class="col-md-3"><div class="card card-stat p-3 shadow-sm"><h6>Total Farms</h6><h3>24</h3></div></div>
            <div class="col-md-3"><div class="card card-stat p-3 shadow-sm"><h6>Farmers</h6><h3>18</h3></div></div>
            <div class="col-md-3"><div class="card card-stat p-3 shadow-sm"><h6>Total Yield</h6><h3>1,240 Tons</h3></div></div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6"><div class="card p-3 shadow-sm"><canvas id="barChart"></canvas></div></div>
            <div class="col-md-6"><div class="card p-3 shadow-sm"><canvas id="pieChart"></canvas></div></div>
            <div class="col-md-12"><div class="card p-3 shadow-sm"><canvas id="lineChart"></canvas></div></div>
        </div>
    </div>

    <!-- CROPS SECTION -->
    <div id="cropsSection" style="display:none;">
        <div class="card shadow-sm p-3">
            <div class="d-flex justify-content-between mb-3">
                <h5>Crops Management</h5>
                <input type="text" id="searchInput" class="form-control w-25" placeholder="Search Crop...">
            </div>

            <form id="cropForm" class="row g-3 mb-3">
                <div class="col-md-4"><input type="text" id="cropName" class="form-control" placeholder="Crop Name" required></div>
                <div class="col-md-4"><input type="number" id="cropYield" class="form-control" placeholder="Yield (Tons)" required></div>
                <div class="col-md-4"><button type="submit" class="btn btn-success w-100">Add Crop</button></div>
            </form>

            <table class="table table-bordered table-hover">
                <thead><tr><th>Name</th><th>Yield</th><th>Actions</th></tr></thead>
                <tbody id="cropTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
